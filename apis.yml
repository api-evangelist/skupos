aid: skupos
name: Skupos
description: >-
  Skupos is a retail technology platform for the convenience store industry that
  connects independent c-store retailers, distributors, and consumer brands
  through a single data network. Its SaaS platform delivers scan-data
  automation, back-office and financial management, tobacco scan-data
  incentives, digital loyalty and funded promotions, and GasBuddy integration.
  Founded in 2016 and backed by Insight Partners, Skupos was acquired by PDI
  Technologies in 2023 and now operates as part of the PDI Essentials product
  suite. Skupos runs an authenticated production API at api.skupos.com but
  publishes no public API specification, developer portal, or client SDKs.
